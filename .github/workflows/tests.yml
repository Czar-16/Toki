name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install Fish (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fish
      - name: Install Fish (macOS)
        if: runner.os == 'macOS'
        run: brew install fish
      - name: Check Fish syntax
        run: fish -n fish/*.fish
      - name: Test
        timeout-minutes: 3
        run: python3 -m unittest discover -s tests -v
